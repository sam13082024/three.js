
		<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demon Slayer 3D Website</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background-color: #1a1a1a;
      color: white;
    }
    #scene-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    .content {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
    }
    h1 {
      font-size: 3rem;
      color: #ff6b6b;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
    }
    p {
      font-size: 1.2rem;
      max-width: 400px;
    }
  </style>
</head>
<body>
  <!-- Container for the 3D scene -->
  <div id="scene-container"></div>

  <!-- Content overlay -->
  <div class="content">
    <h1>Demon Slayer</h1>
    <p>Welcome to the world of Demon Slayer! Explore the 3D models of your favorite characters and scenes.</p>
  </div>

  <!-- Three.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r146/three.min.js"></script>
  <!-- GLTFLoader for loading 3D models -->
  <script src="https://cdn.jsdelivr.net/npm/three/examples/js/loaders/GLTFLoader.js"></script>

  <script>
    // Set up the scene, camera, and renderer
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer();
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('scene-container').appendChild(renderer.domElement);

    // Add lighting
    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(5, 5, 5).normalize();
    scene.add(light);

    // Load a 3D model (replace with your GLTF/GLB file)
    const loader = new THREE.GLTFLoader();
    loader.load(
      'path/to/your-model.glb', // Replace with the path to your 3D model
      function (gltf) {
        const model = gltf.scene;
        scene.add(model);
      },
      undefined,
      function (error) {
        console.error('Error loading 3D model:', error);
      }
    );

    // Position the camera
    camera.position.z = 5;

    // Animation loop
    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();

    // Handle window resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
